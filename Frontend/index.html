<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px 14px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #333;
      color: #fff;
    }

    tr:nth-child(even) {
      background: #f0f0f0;
    }

    .status {
      margin-bottom: 12px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const API = "https://movies-api-n9r5.onrender.com";

    function App() {
      const [movies, setMovies] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState("");

      React.useEffect(() => {
        fetch(`${API}/movies`)
          .then(res => res.json())
          .then(data => {
            setMovies(Array.isArray(data) ? data : (data.movies || []));
            setLoading(false);
          })
          .catch(() => {
            setError("Failed to fetch data from API.");
            setLoading(false);
          });
      }, []);

      if (loading) return <p>Loading...</p>;
      if (error)   return <p style={{ color: "red" }}>{error}</p>;

      return (
        <div>
          <h1>Movies</h1>
          <p className="status">{movies.length} records found</p>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Year</th>
                <th>Director</th>
                <th>Rating</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody>
              {movies.map(movie => (
                <tr key={movie.id}>
                  <td>{movie.id}</td>
                  <td>{movie.title}</td>
                  <td>{movie.genre}</td>
                  <td>{movie.year}</td>
                  <td>{movie.director}</td>
                  <td>{movie.rating}</td>
                  <td>{movie.description}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
